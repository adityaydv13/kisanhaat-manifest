apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kisanhaat-backend
  template:
    metadata:
      labels:
        app: kisanhaat-backend
    spec:
      containers: 
        - name: backend
          image: adityaydv10/kisanhaat-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: MONGODB_URI
              value: "mongodb://mongo-service:27017/kisanhaat"
            - name: RAZORPAY_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: razorpay-secret
                  key: RAZORPAY_KEY_ID
            - name: RAZORPAY_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: razorpay-secret
                  key: RAZORPAY_KEY_SECRET

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: kisanhaat-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
